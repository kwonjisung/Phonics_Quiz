<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하루 영단어 카드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Jua&display=swap">
<style>
/* Layout: one slide-card per word, PPT-style, with a date bar on top and a 3-word strip below */
:root{
  --bg:#F3F6FB; --surface:#FFFFFF; --ink:#1F2A44; --muted:#5D6886; --line:#DCE3EF;
  --accent:#E8643A; --accent-soft:#FDE8DF; --brand:#3A5BD9; --brand-soft:#E4EAFC;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --word:"Andika","Comic Sans MS",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A29; --surface:#1E2638; --ink:#EEF2FA; --muted:#A3AECB; --line:#2E3850;
  --accent:#FF8A5E; --accent-soft:#3A2620; --brand:#8FA6FF; --brand-soft:#26304F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A29; --surface:#1E2638; --ink:#EEF2FA; --muted:#A3AECB; --line:#2E3850;
  --accent:#FF8A5E; --accent-soft:#3A2620; --brand:#8FA6FF; --brand-soft:#26304F; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-direction:column;gap:10px}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
.datebar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px}
.datebar .day{flex:1;min-width:0;text-align:center}
.day b{display:block;font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1}
.day small{color:var(--muted);font-size:13px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer;display:grid;place-items:center}
.icon:disabled{opacity:.35;cursor:default}
select{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 0;gap:8px}
.chip{font-size:12px;letter-spacing:.04em;padding:4px 10px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.word{font-family:var(--word);font-weight:700;font-size:clamp(68px,20vw,104px);line-height:1;text-align:center;padding:10px 0 2px;letter-spacing:.02em}
.word .hl{color:var(--accent)}
.word.rise span{display:inline-block;animation:rise 2.2s ease-in-out infinite}
.word.rise span:nth-child(2){animation-delay:.2s}
@keyframes rise{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.pron{text-align:center;color:var(--muted);font-size:15px;margin:0 0 10px}
.stage{display:block;width:100%;height:auto}
.foot{padding:12px 16px 16px;display:flex;flex-direction:column;gap:10px}
.sent{font-family:var(--word);font-size:21px;font-weight:700;margin:0}
.ko{font-size:14px;color:var(--muted);margin:2px 0 0}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.strip button{font-family:var(--word);font-weight:700;font-size:22px;padding:10px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.strip button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.nav{display:flex;justify-content:space-between;gap:8px}
.nav .btn{flex:1}
.note{font-size:12px;color:var(--muted);margin:0;text-align:center}
button:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
svg *{transform-box:fill-box}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
/* scene keyframes */
@keyframes rock{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(18px,-40px);opacity:0}}
@keyframes steam{0%{transform:translateY(10px);opacity:0}40%{opacity:.9}100%{transform:translateY(-40px);opacity:0}}
@keyframes popin{0%,8%{transform:scale(0)}20%,85%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-46px)}}
@keyframes eat{0%,25%{transform:scale(1)}45%{transform:scale(.6)}65%,90%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes fadeT{0%,55%{opacity:0}65%,88%{opacity:1}100%{opacity:0}}
@keyframes slidein{0%,10%{transform:translateX(150px)}45%,85%{transform:translateX(0)}100%{transform:translateX(150px)}}
@keyframes flick{0%,100%{transform:scaleY(1) rotate(-6deg)}50%{transform:scaleY(1.25) rotate(6deg)}}
@keyframes wave{0%{transform:translateX(0)}100%{transform:translateX(-40px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes roll{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(0,-50px) rotate(180deg)}100%{transform:translate(0,0) rotate(360deg)}}
@keyframes give{0%,15%{transform:translateX(0)}55%,85%{transform:translateX(150px)}100%{transform:translateX(0)}}
@keyframes dash{0%{stroke-dashoffset:30}100%{stroke-dashoffset:0}}
@keyframes tw{0%,100%{transform:scale(.8);opacity:.6}50%{transform:scale(1.2);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes peek{0%,15%,85%,100%{transform:translateY(60px)}35%,65%{transform:translateY(0)}}
@keyframes drive{0%{transform:translateX(-200px)}100%{transform:translateX(360px)}}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
@keyframes scoop{0%,100%{transform:rotate(20deg) translateY(0)}50%{transform:rotate(-30deg) translateY(-14px)}}
@keyframes rain{0%{transform:translateY(-30px);opacity:0}20%{opacity:1}100%{transform:translateY(120px);opacity:0}}
@keyframes umb{0%,25%{transform:scaleX(.15)}40%,90%{transform:scaleX(1)}100%{transform:scaleX(.15)}}
@keyframes jumpout{0%,20%{transform:translate(0,40px)}40%{transform:translate(40px,-40px)}55%,85%{transform:translate(90px,0)}100%{transform:translate(0,40px)}}
@keyframes draw{0%,10%{stroke-dashoffset:400}60%,90%{stroke-dashoffset:0}100%{stroke-dashoffset:400}}
@keyframes ball{0%,25%{transform:translate(0,0)}45%{transform:translate(90px,-30px)}62%{transform:translate(180px,0)}75%,100%{transform:translate(196px,0)}}
@keyframes leg{0%,15%{transform:rotate(0)}25%{transform:rotate(-55deg)}38%,100%{transform:rotate(0)}}
@keyframes net{0%,62%,80%,100%{transform:scale(1)}68%{transform:scale(1.08)}}
@keyframes sky{0%{transform:translateY(-60px)}100%{transform:translateY(270px)}}
@keyframes ln{0%{transform:translateY(-10px);opacity:0}30%{opacity:1}100%{transform:translateY(50px);opacity:0}}
@keyframes arm{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes mo{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes rollin{0%,10%{transform:translate(0,0) rotate(0);opacity:1}45%{transform:translate(166px,0) rotate(360deg);opacity:1}58%,100%{transform:translate(170px,22px) scale(.3);opacity:0}}
@keyframes drop{0%,15%{transform:translateY(-90px);opacity:0}20%{opacity:1}40%{transform:translateY(0)}48%{transform:translateY(-12px)}55%,90%{transform:translateY(0);opacity:1}100%{opacity:0}}
@keyframes flag{0%,100%{transform:skewY(0)}50%{transform:skewY(-12deg)}}
@keyframes up{0%,15%{transform:translateY(50px)}35%,60%{transform:translateY(0)}80%,100%{transform:translateY(50px)}}
@keyframes blink{0%,45%,55%,100%{transform:scaleY(1)}50%{transform:scaleY(.1)}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>하루 영단어 카드</h1>
    <div class="datebar">
      <button class="icon" id="prevDay" aria-label="이전 시험 날짜">‹</button>
      <div class="day"><b id="dayLabel">10/28 (수)</b><small id="daySub">시험 날짜</small></div>
      <button class="icon" id="nextDay" aria-label="다음 시험 날짜">›</button>
    </div>
    <label class="note" for="dateSel" style="display:flex;gap:8px;align-items:center;justify-content:center">날짜 바로 고르기
      <select id="dateSel"></select></label>
  </header>

  <article class="card" aria-live="polite">
    <div class="top"><span class="chip" id="chip">o_e</span><span class="count" id="count">1 / 3</span></div>
    <div class="word" id="word">will</div>
    <p class="pron" id="pron">[윌] · ~할 거야</p>
    <svg class="stage" id="stage" viewBox="0 0 340 200" role="img"><title id="stageTitle"></title><g id="scene"></g></svg>
    <div class="foot">
      <div><p class="sent" id="sent"></p><p class="ko" id="ko"></p></div>
      <div class="btns">
        <button class="btn main" id="sayWord">🔊 단어</button>
        <button class="btn" id="saySent">문장 듣기</button>
        <button class="btn" id="saySlow">천천히</button>
      </div>
    </div>
  </article>

  <div class="strip" id="strip"></div>
  <div class="nav"><button class="btn" id="prevCard">‹ 이전 단어</button><button class="btn" id="nextCard">다음 단어 ›</button></div>
  <p class="note">주황색 글자는 같은 소리 규칙이에요. 끝에 e가 붙으면 앞 모음이 자기 이름 소리로 길어져요.</p>
</div>

<script>
const S = (bg, inner) => ({bg, inner});
const kid = (x, c1, c2, extra='') => `<circle cx="${x}" cy="112" r="14" fill="${c1}"/><rect x="${x-9}" y="127" width="18" height="30" rx="7" fill="${c2}"/><line x1="${x-4}" y1="155" x2="${x-7}" y2="180" stroke="${c1}" stroke-width="6" stroke-linecap="round"/><line x1="${x+4}" y1="155" x2="${x+7}" y2="180" stroke="${c1}" stroke-width="6" stroke-linecap="round"/>${extra}`;
const ground = c => `<line x1="10" y1="182" x2="330" y2="182" stroke="${c}" stroke-width="2"/>`;
const sb = (cx,cy,r,c) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="${c}" stroke-width="2"/><path d="M${cx} ${cy-r*.6}l${r*.5} ${r*.38}-${r*.18} ${r*.58}h-${r*.64}l-${r*.18}-${r*.58}z" fill="${c}"/>`;
const star = (x,y,s,c) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0-10l3 6.5 7 1-5 5 1.2 7L0 6l-6.2 3.5L-5 2.5l-5-5 7-1z" fill="${c}"/>`;
const brick = (x,y,c) => `<rect x="${x}" y="${y}" width="34" height="18" rx="2" fill="${c}"/><rect x="${x+5}" y="${y-6}" width="8" height="6" rx="1" fill="${c}"/><rect x="${x+21}" y="${y-6}" width="8" height="6" rx="1" fill="${c}"/>`;

const SCENES = {
  cot: S('#E6F1FB', `${ground('#B5D4F4')}<g style="animation:rock 2s ease-in-out infinite;transform-origin:50% 100%"><rect x="110" y="110" width="120" height="58" rx="6" fill="#fff" stroke="#185FA5" stroke-width="3"/><path d="M130 110V168M150 110V168M170 110V168M190 110V168M210 110V168" stroke="#B5D4F4" stroke-width="3"/><circle cx="150" cy="140" r="12" fill="#F5C4B3"/><rect x="160" y="132" width="52" height="20" rx="8" fill="#85B7EB"/><path d="M110 168Q170 190 230 168" fill="none" stroke="#185FA5" stroke-width="4"/></g><text x="200" y="96" font-size="22" font-weight="700" fill="#185FA5" style="animation:zz 2.4s infinite">z</text><text x="212" y="90" font-size="16" font-weight="700" fill="#185FA5" style="animation:zz 2.4s .8s infinite">z</text>`),
  hot: S('#FCEBEB', `${ground('#F7C1C1')}<g fill="none" stroke="#E24B4A" stroke-width="5" stroke-linecap="round"><path d="M140 110q-10-14 0-28t0-28" style="animation:steam 1.8s infinite"/><path d="M170 110q-10-14 0-28t0-28" style="animation:steam 1.8s .5s infinite"/><path d="M200 110q-10-14 0-28t0-28" style="animation:steam 1.8s 1s infinite"/></g><path d="M115 120h110q0 50-55 56q-55-6-55-56z" fill="#F09595" stroke="#A32D2D" stroke-width="3"/><ellipse cx="170" cy="120" rx="55" ry="8" fill="#FAC775"/><text x="270" y="150" font-size="34" style="animation:pulse 1s infinite;transform-origin:center">🔥</text>`),
  dot: S('#FAEEDA', ['#E24B4A','#378ADD','#1D9E75','#EF9F27','#7F77DD','#D4537E'].map((c,i)=>`<circle cx="${70+i*40}" cy="${i%2?90:130}" r="15" fill="${c}" style="animation:popin 3s ${i*.3}s infinite;transform-origin:center"/>`).join('')),
  all: S('#EAF3DE', `${ground('#97C459')}` + ['#E24B4A','#378ADD','#EF9F27','#1D9E75','#7F77DD'].map((c,i)=>`<circle cx="${70+i*50}" cy="164" r="16" fill="${c}" style="animation:bounce .9s ${i*.12}s ease-in-out infinite"/>`).join('') + `<text x="170" y="50" text-anchor="middle" font-size="18" font-weight="700" fill="#27500A">다 같이 통통!</text>`),
  had: S('#FBEAF0', `${ground('#F4C0D1')}${kid(80,'#993556','#D4537E')}<ellipse cx="220" cy="170" rx="56" ry="10" fill="#fff" stroke="#D4537E" stroke-width="2"/><g style="animation:eat 3s infinite;transform-origin:50% 100%"><path d="M200 168v-34q20-22 40 0v34z" fill="#ED93B1" stroke="#993556" stroke-width="2"/></g><text x="220" y="120" text-anchor="middle" font-size="20" font-weight="700" fill="#72243E" style="animation:fadeT 3s infinite">냠! 다 먹었다</text>`),
  by: S('#EEEDFE', `${ground('#AFA9EC')}<rect x="90" y="150" width="160" height="12" rx="4" fill="#534AB7"/><rect x="100" y="162" width="8" height="20" fill="#534AB7"/><rect x="232" y="162" width="8" height="20" fill="#534AB7"/><circle cx="140" cy="112" r="14" fill="#534AB7"/><rect x="131" y="127" width="18" height="24" rx="7" fill="#7F77DD"/><g style="animation:slidein 3s ease-in-out infinite"><circle cx="190" cy="112" r="14" fill="#D85A30"/><rect x="181" y="127" width="18" height="24" rx="7" fill="#F0997B"/></g><text x="165" y="80" text-anchor="middle" font-size="22" style="animation:pulse 1.2s infinite;transform-origin:center">💜</text>`),
  cake: S('#FBEAF0', `${ground('#F4C0D1')}<rect x="110" y="130" width="120" height="50" rx="8" fill="#ED93B1"/><rect x="125" y="96" width="90" height="38" rx="8" fill="#F4C0D1"/><path d="M110 140q15 10 30 0t30 0 30 0 30 0" fill="none" stroke="#fff" stroke-width="5"/>` + [145,170,195].map((x,i)=>`<rect x="${x-3}" y="74" width="6" height="22" fill="#378ADD"/><ellipse cx="${x}" cy="66" rx="5" ry="9" fill="#EF9F27" style="animation:flick .5s ${i*.15}s infinite;transform-origin:50% 100%"/>`).join('')),
  lake: S('#E1F5EE', `<path d="M40 120 Q170 90 300 120 L300 190 L40 190 Z" fill="#5DCAA5"/><g style="animation:wave 2s linear infinite"><path d="M40 140q20-8 40 0t40 0 40 0 40 0 40 0 40 0 40 0" fill="none" stroke="#E1F5EE" stroke-width="3"/><path d="M60 165q20-8 40 0t40 0 40 0 40 0 40 0 40 0" fill="none" stroke="#E1F5EE" stroke-width="3"/></g><g style="animation:bob 1.4s ease-in-out infinite;transform-origin:center"><ellipse cx="170" cy="122" rx="28" ry="14" fill="#FAC775"/><circle cx="190" cy="100" r="11" fill="#FAC775"/><path d="M199 100l12 3-12 3z" fill="#D85A30"/><circle cx="193" cy="97" r="2" fill="#2C2C2A"/></g>`),
  game: S('#E6F1FB', `${ground('#B5D4F4')}<g style="animation:roll 1.4s ease-in-out infinite"><rect x="110" y="128" width="48" height="48" rx="9" fill="#fff" stroke="#185FA5" stroke-width="3"/><circle cx="122" cy="140" r="4" fill="#185FA5"/><circle cx="134" cy="152" r="4" fill="#185FA5"/><circle cx="146" cy="164" r="4" fill="#185FA5"/></g><g style="animation:roll 1.4s .35s ease-in-out infinite"><rect x="186" y="128" width="48" height="48" rx="9" fill="#fff" stroke="#E24B4A" stroke-width="3"/><circle cx="198" cy="140" r="4" fill="#E24B4A"/><circle cx="222" cy="140" r="4" fill="#E24B4A"/><circle cx="198" cy="164" r="4" fill="#E24B4A"/><circle cx="222" cy="164" r="4" fill="#E24B4A"/></g>`),
  from: S('#FAEEDA', `${ground('#FAC775')}<circle cx="70" cy="92" r="17" fill="#854F0B"/><rect x="59" y="110" width="22" height="46" rx="8" fill="#BA7517"/><line x1="64" y1="156" x2="61" y2="180" stroke="#854F0B" stroke-width="7" stroke-linecap="round"/><line x1="76" y1="156" x2="79" y2="180" stroke="#854F0B" stroke-width="7" stroke-linecap="round"/><text x="70" y="70" text-anchor="middle" font-size="14" font-weight="700" fill="#633806">엄마</text>${kid(270,'#185FA5','#378ADD')}<g style="animation:give 3s ease-in-out infinite"><rect x="90" y="122" width="30" height="26" rx="3" fill="#E24B4A"/><rect x="102" y="122" width="6" height="26" fill="#FAC775"/><path d="M105 122q-10-12-14 0M105 122q10-12 14 0" fill="none" stroke="#FAC775" stroke-width="3"/></g>`),
  that: S('#EEEDFE', `${ground('#AFA9EC')}${kid(60,'#534AB7','#7F77DD',`<line x1="69" y1="132" x2="96" y2="118" stroke="#534AB7" stroke-width="5" stroke-linecap="round"/>`)}<line x1="104" y1="114" x2="268" y2="66" stroke="#7F77DD" stroke-width="3" stroke-dasharray="8 7" style="animation:dash .6s linear infinite"/><g style="animation:tw 1.2s infinite;transform-origin:center">${star(285,60,2,'#EF9F27')}</g><text x="285" y="104" text-anchor="middle" font-size="13" fill="#3C3489">저~기 멀리</text>`),
  this: S('#E1F5EE', `${ground('#5DCAA5')}${kid(150,'#0F6E56','#1D9E75',`<line x1="158" y1="134" x2="180" y2="138" stroke="#0F6E56" stroke-width="5" stroke-linecap="round"/>`)}<g style="animation:pulse 1.1s infinite;transform-origin:center">${brick(178,128,'#E24B4A')}</g><text x="200" y="104" text-anchor="middle" font-size="13" fill="#085041">바로 여기, 내 손에</text>`),

  ride: S('#E6F1FB', `${ground('#85B7EB')}<g style="animation:drive 3.5s linear infinite"><rect x="0" y="118" width="140" height="56" rx="12" fill="#EF9F27"/><rect x="12" y="128" width="26" height="20" rx="3" fill="#E6F1FB"/><rect x="46" y="128" width="26" height="20" rx="3" fill="#E6F1FB"/><rect x="80" y="128" width="26" height="20" rx="3" fill="#E6F1FB"/><circle cx="59" cy="138" r="7" fill="#185FA5"/><rect x="112" y="128" width="20" height="30" rx="3" fill="#E6F1FB"/><g style="animation:spin .5s linear infinite;transform-origin:center"><circle cx="32" cy="176" r="12" fill="#2C2C2A"/><rect x="30" y="166" width="4" height="20" fill="#888780"/></g><g style="animation:spin .5s linear infinite;transform-origin:center"><circle cx="110" cy="176" r="12" fill="#2C2C2A"/><rect x="108" y="166" width="4" height="20" fill="#888780"/></g></g>`),

  {d:'2026-10-21', pat:'Sight words', words:[W('use','유즈','사용하다','I use a spoon.','나는 숟가락을 써요.',[],'숟가락으로 그릇을 뜨는 장면'),W('if','이프','만약 ~하면','If it rains, open it!','비가 오면 펼쳐!',[],'비가 오자 우산이 펼쳐지는 장면'),W('out','아웃','밖으로','The cat jumps out!','고양이가 밖으로 뛰어요!',[],'고양이가 상자 밖으로 폴짝 뛰는 장면')]},

const WD = ['일','월','화','수','목','금','토'];
const fmt = s => { const [y,m,d]=s.split('-').map(Number); const dt=new Date(y,m-1,d); return `${m}/${d} (${WD[dt.getDay()]})`; };
const $ = id => document.getElementById(id);

let di = 0, wi = 0;
(function initDay(){
  let saved=null; try{saved=localStorage.getItem('wc-day')}catch(e){}
  const n=new Date(), today=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  const si=DAYS.findIndex(x=>x.d===saved);
  if(si>=0) di=si; else { const up=DAYS.findIndex(x=>x.d>=today); di = up>=0?up:DAYS.length-1; }
})();
DAYS.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=fmt(x.d)+' · '+x.words.map(w=>w.w).join(', ');$('dateSel').appendChild(o)});

function render(){
  const day=DAYS[di], it=day.words[wi], n=new Date();
  const today=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
  $('dayLabel').textContent=fmt(day.d);
  $('daySub').textContent = day.d===today?'오늘 시험':(day.d>today?'다가오는 시험':'지난 시험 · 복습');
  $('dateSel').value=di; $('prevDay').disabled=di===0; $('nextDay').disabled=di===DAYS.length-1;
  $('chip').textContent=day.pat; $('count').textContent=`${wi+1} / 3`;
  const w=$('word'); w.className='word'+(it.w==='up'?' rise':'');
  w.innerHTML=[...it.w].map((c,i)=>`<span${it.hl.includes(i)?' class="hl"':''}>${c}</span>`).join('');
  $('pron').textContent=`[${it.pron}] · ${it.ko}`;
  const sc=SCENES[it.w]; $('stage').style.background=sc.bg; $('scene').innerHTML=sc.inner; $('stageTitle').textContent=it.alt;
  $('sent').textContent=it.sent; $('ko').textContent=it.sko;
  $('strip').innerHTML=day.words.map((x,i)=>`<button data-i="${i}" aria-current="${i===wi}">${x.w}</button>`).join('');
  $('prevCard').disabled=wi===0; $('nextCard').disabled=wi===2;
  try{localStorage.setItem('wc-day',day.d)}catch(e){}
}
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;speechSynthesis.speak(u);}catch(e){}}
const cur=()=>DAYS[di].words[wi];
$('sayWord').onclick=()=>say(cur().w,.8);
$('saySent').onclick=()=>say(cur().sent,.8);
$('saySlow').onclick=()=>say(cur().w,.45);
$('prevDay').onclick=()=>{if(di>0){di--;wi=0;render()}};
$('nextDay').onclick=()=>{if(di<DAYS.length-1){di++;wi=0;render()}};
$('dateSel').onchange=e=>{di=+e.target.value;wi=0;render()};
$('prevCard').onclick=()=>{if(wi>0){wi--;render()}};
$('nextCard').onclick=()=>{if(wi<2){wi++;render()}};
$('strip').onclick=e=>{const b=e.target.closest('button');if(b){wi=+b.dataset.i;render()}};
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowRight')$('nextCard').click();if(e.key==='ArrowLeft')$('prevCard').click();});
let sx=null;const card=document.querySelector('.card');
card.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
card.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)(dx<0?$('nextCard'):$('prevCard')).click();sx=null});
render();
</script>
